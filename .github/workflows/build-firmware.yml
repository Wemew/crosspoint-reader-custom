name: Build Custom Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
env:
  PLATFORMIO_DISABLE_UPDATE_CHECK: "true"
  UV_CONSTRAINT: /tmp/constraints.txt
  PIP_CONSTRAINT: /tmp/constraints.txt

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            name: crosspoint-x3-x4
          - pio_env: x4pro-gh_release
            name: crosspoint-x4pro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          echo "pioarduino==6.1.19" > /tmp/constraints.txt
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Build firmware
        run: CROSSPOINT_RC_HASH="$(git rev-parse --short=7 HEAD)" pio run -e "${{ matrix.pio_env }}" -j1

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: .pio/build/${{ matrix.pio_env }}/firmware.bin
          if-no-files-found: error
